<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clan Activity Tracker · Admin login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/">⚔ Clan Activity Tracker</a>
    <h1>Admin access</h1>
    <p class="muted">Manage the roster, wars, and Clan Capital participation.</p>
    <div id="notice" class="notice" role="status"></div>
    <form id="login-form" class="stack">
      <label>Email <input name="email" type="email" autocomplete="email" required></label>
      <label>Password
        <span class="password-field">
          <input name="password" type="password" minlength="8" autocomplete="current-password" required>
          <button type="button" class="password-toggle secondary" aria-controls="login-password" aria-label="Show password">Show</button>
        </span>
      </label>
      <button type="submit">Log in</button>
    </form>
    <details class="password-help">
      <summary>Forgot password?</summary>
      <form id="forgot-form" class="stack compact">
        <label>Account email <input name="email" type="email" autocomplete="email" required></label>
        <button type="submit" class="secondary">Send reset code</button>
      </form>
      <form id="reset-form" class="stack compact">
        <label>Reset email <input name="email" type="email" required></label>
        <label>6-digit reset code <input name="code" inputmode="numeric" pattern="[0-9]{6}" required></label>
        <label>New password
          <span class="password-field">
            <input name="password" type="password" minlength="8" autocomplete="new-password" required>
            <button type="button" class="password-toggle secondary" aria-label="Show password">Show</button>
          </span>
        </label>
        <label>Confirm new password
          <span class="password-field">
            <input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
            <button type="button" class="password-toggle secondary" aria-label="Show password">Show</button>
          </span>
        </label>
        <button type="submit" class="secondary">Reset password</button>
      </form>
    </details>
    <details>
      <summary>First time here?</summary>
      <form id="register-form" class="stack compact">
        <label>Email <input name="email" type="email" required></label>
        <label>Password
          <span class="password-field">
            <input name="password" type="password" minlength="8" autocomplete="new-password" required>
            <button type="button" class="password-toggle secondary" aria-label="Show password">Show</button>
          </span>
        </label>
        <button type="submit" class="secondary">Register admin</button>
      </form>
      <form id="confirm-form" class="stack compact">
        <label>Confirmation email <input name="email" type="email" required></label>
        <label>6-digit code <input name="code" inputmode="numeric" pattern="[0-9]{6}" required></label>
        <button type="submit" class="secondary">Confirm email</button>
      </form>
    </details>
    <p><a href="/">Back to tracker</a></p>
  </main>
  <script src="/js/auth.js"></script>
</body>
</html>
